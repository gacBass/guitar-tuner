<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#12141a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tuner">
<title>Guitar &amp; Bass Tuner</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="tuner">
    <header>
      <h1>Tuner</h1>
      <div class="instrument-select">
        <button class="inst-btn active" data-tuning="guitar">Guitar</button>
        <button class="inst-btn" data-tuning="bass4">Bass (4)</button>
        <button class="inst-btn" data-tuning="bass5">Bass (5)</button>
        <button class="inst-btn" data-tuning="chromatic">Chromatic</button>
      </div>
    </header>

    <section class="gauge-wrap">
      <div class="gauge">
        <div class="gauge-scale">
          <span class="tick flat">-50</span>
          <span class="tick">-25</span>
          <span class="tick center">0</span>
          <span class="tick">+25</span>
          <span class="tick sharp">+50</span>
        </div>
        <div class="needle" id="needle"></div>
        <div class="gauge-pivot"></div>
      </div>
    </section>

    <section class="readout">
      <div class="note" id="note">–</div>
      <div class="freq" id="freq">0.0 Hz</div>
      <div class="status" id="status">Tap start and play a note</div>
    </section>

    <section class="strings" id="strings"></section>

    <section class="controls">
      <button id="startBtn">Start Tuner</button>
      <label class="a4-label">
        A4
        <input type="number" id="a4Input" value="440" min="415" max="466" step="1">
        Hz
      </label>
    </section>
  </main>

  <script src="tuner.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("service-worker.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
